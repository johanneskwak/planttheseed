<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마지막 합의 | 핵확산 시뮬레이션</title>
<meta name="theme-color" content="#080f18">
<meta name="description" content="사회② 국제사회의 갈등과 협력 — 가상 국가의 대표가 되어 선택하는 핵확산 시뮬레이션">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6EAED; --card:#F4F6F7; --ink:#12212E; --ink-2:#4C6069; --rule:#A6B2BB;
  --chamber:#16283A; --gold:#A8873C;
  --peace:#2E6E9E; --nuke:#B0402C; --neu:#8A9499;
  --r:2px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:16px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
.disp{font-family:'Black Han Sans',sans-serif;font-weight:400;letter-spacing:-.01em}
h1{font-family:'Black Han Sans',sans-serif;font-size:1.7rem;margin:0 0 .3rem;font-weight:400}
h2{font-family:'Black Han Sans',sans-serif;font-size:1.05rem;margin:0 0 .6rem;font-weight:400}
.wrap{max-width:1120px;margin:0 auto;padding:18px 18px 72px}
.narrow{max-width:500px}
.muted{color:var(--ink-2)} .small{font-size:.82rem}
hr.rule{border:0;border-top:1px solid var(--rule);margin:24px 0}
a{color:var(--peace)}

button{font:inherit;cursor:pointer;border-radius:var(--r)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--peace);outline-offset:2px}
.btn{background:var(--ink);color:#fff;border:1px solid var(--ink);padding:.6rem 1.05rem;font-weight:500}
.btn:hover{background:#1B333D}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.ghost:hover{background:#D7DEE1}
.btn.danger{background:var(--nuke);border-color:var(--nuke)}
.btn:disabled{opacity:.34;cursor:not-allowed}
.btn.wide{width:100%}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:.58rem .7rem;border:1px solid var(--rule);border-radius:var(--r);background:#fff;width:100%;color:var(--ink)}
label{display:block;font-size:.84rem;color:var(--ink-2);margin:0 0 .25rem}
.field{margin-bottom:13px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);padding:15px}
.err{background:#F4DED9;border-left:3px solid var(--nuke);color:#7C2C1E;padding:.6rem .8rem;margin:12px 0;font-size:.9rem}
.note{background:var(--card);border-left:3px solid var(--peace);padding:.6rem .8rem;margin:12px 0;font-size:.9rem}
.resolution{border:1px solid var(--gold);border-top:4px solid var(--gold);background:#FBF8F1;
  border-radius:var(--r);padding:15px 17px;margin-top:14px}
.resolution h2{color:#6E5A22;letter-spacing:.02em}
.ballot{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.ballot button{flex:1;min-width:180px;padding:.75rem 1rem;background:#fff;border:1px solid var(--rule);
  border-left:5px solid var(--rule);text-align:left;font-weight:500}
.ballot button:hover{background:var(--card)}
.ballot .bn{border-left-color:var(--nuke)} .ballot .bp{border-left-color:var(--peace)}
.ballot small{display:block;font-weight:400;color:var(--ink-2);font-size:.74rem;margin-top:2px}

/* ── 헤더 ── */
.banner{background:var(--chamber);color:#EEF2F4;border-radius:var(--r);
  border-bottom:3px solid var(--gold);padding:14px 18px;display:flex;
  justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.banner .seal{flex:0 0 auto}
.banner .ttl{display:flex;align-items:center;gap:13px}
.banner .turn{font-family:'Black Han Sans',sans-serif;font-size:1.7rem;line-height:1.05}
.banner .turn span{font-size:.95rem;color:#9FB3C2;font-family:'IBM Plex Sans KR',sans-serif;font-weight:400}
.banner .sub{font-size:.74rem;color:#8FA5B5;margin-top:3px;letter-spacing:.02em}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
  border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:6px}
.hdr .turn{font-family:'Black Han Sans',sans-serif;font-size:2.1rem;line-height:1}
.hdr .turn span{color:var(--ink-2);font-size:1.1rem}
.hdr .sub{font-size:.8rem;color:var(--ink-2);margin-top:2px}
.stats{display:flex;gap:10px;align-items:flex-start}
.stat{text-align:center;border:1px solid var(--rule);border-radius:var(--r);padding:6px 14px 7px;background:#fff;min-width:96px}
.stat b{font-family:'Black Han Sans',sans-serif;font-size:2.4rem;line-height:1;display:block}
.stat span{font-size:.72rem;color:var(--ink-2);display:block;margin-top:2px;white-space:nowrap}
.stat.nu{border-color:var(--nuke)} .stat.nu b{color:var(--nuke)}
.stat.pe{border-color:var(--peace)} .stat.pe b{color:var(--peace)}
.stats .memo{font-size:.68rem;color:var(--ink-2);align-self:flex-end;max-width:128px;line-height:1.35;text-align:left}
.banner .memo{color:#8FA5B5}

/* ── 턴 진행 눈금 ── */
.pips{display:flex;gap:3px;margin:22px 0 20px}
.pip{flex:1;height:9px;background:#CBD5D8;border-radius:1px;position:relative}
.pip.on{background:var(--ink)}
.pip.now{background:var(--peace);box-shadow:0 0 0 2px rgba(47,111,143,.28)}
.pip.un::after{content:'UN';position:absolute;top:-15px;left:50%;transform:translateX(-50%);
  font-size:.6rem;letter-spacing:.05em;color:var(--peace);font-weight:600}
.pip.un{background:#B4C3C8}.pip.un.on{background:var(--peace)}

/* ── 레이스 레인 (신호 요소) ── */
.floor{background:linear-gradient(#D6DEE3,#EAEEF0);border:1px solid #9DACB6;
  border-radius:var(--r);padding:13px 17px 8px;margin-top:12px;
  box-shadow:inset 0 1px 0 #F2F5F6}
.lane{display:grid;grid-template-columns:minmax(104px,164px) 1fr 74px;gap:14px;align-items:center;
  padding:8px 0;border-bottom:1px solid rgba(166,178,187,.5)}
.lane:last-of-type{border-bottom:0}
.lane.colhead{font-size:.72rem;color:var(--ink-2);letter-spacing:.03em;padding:0 0 7px;
  border-bottom:2px solid var(--ink)}
.plate{background:#FAFBFB;border:1px solid #97A6B0;border-top:3px solid var(--pc,#888);
  border-radius:1px;padding:6px 9px 5px;box-shadow:0 1px 0 rgba(18,33,46,.16)}
.plate .cty{font-family:'Black Han Sans',sans-serif;font-size:1.08rem;line-height:1.1;letter-spacing:.01em}
.plate .tier{font-size:.66rem;color:var(--ink-2);letter-spacing:.04em;margin-top:1px}
.gauges{display:flex;flex-direction:column;gap:4px}
.strip{position:relative;border-radius:1px;overflow:hidden}
.strip.p{height:22px;background:#CFD9DD}
.strip.n{height:11px;background:#CFD9DD}
.fillp{position:absolute;inset:0 auto 0 0;background:var(--peace);transition:width .8s cubic-bezier(.2,.7,.3,1)}
.filln{position:absolute;inset:0 auto 0 0;background:var(--nuke);transition:width .8s cubic-bezier(.2,.7,.3,1)}
.fog{position:absolute;inset:0;background-image:repeating-linear-gradient(115deg,
  #B7C3C7 0 6px, #C6D0D4 6px 12px)}
.fog::after{content:'비공개';position:absolute;left:7px;top:50%;transform:translateY(-50%);
  font-size:.62rem;color:#5E7079;letter-spacing:.08em}
.goal{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);right:0}
.lane .val{text-align:right;font-family:'Black Han Sans',sans-serif;font-size:1.5rem;line-height:1}
.lane .val i{display:block;font-style:normal;font-family:'IBM Plex Sans KR',sans-serif;
  font-size:.7rem;color:var(--ink-2);line-height:1.3;margin-top:3px}
.lane.hot .plate{border-color:var(--nuke);background:#FBF0ED}
.lane.hot .val i{color:var(--nuke)}
.legend{display:flex;gap:16px;font-size:.74rem;color:var(--ink-2);margin:8px 0 0}
.legend b{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:4px;border-radius:1px}

/* ── 학생 ── */
.flag{height:8px;margin-bottom:12px;border-radius:1px}
.mine{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.mg{border:1px solid var(--rule);border-radius:var(--r);padding:12px 13px;background:#fff}
.mg.secret{background:repeating-linear-gradient(115deg,#F3F6F6 0 8px,#EAEFF0 8px 16px);
  border-style:dashed;border-color:var(--nuke)}
.mg .lbl{font-size:.74rem;color:var(--ink-2)}
.mg .v{font-family:'Black Han Sans',sans-serif;font-size:2.3rem;line-height:1.05}
.mg.pub .v{color:var(--peace)} .mg.secret .v{color:var(--nuke)}
.mg .of{font-size:.72rem;color:var(--ink-2)}
.mini-bar{height:5px;background:#CFD9DD;border-radius:1px;margin-top:7px;overflow:hidden}
.mini-bar i{display:block;height:100%}
.choices{display:grid;gap:10px;margin-top:4px}
.choice{border:1px solid var(--rule);border-left:6px solid var(--rule);background:#fff;
  border-radius:var(--r);padding:14px 16px;text-align:left;width:100%;transition:transform .07s}
.choice:active{transform:scale(.99)}
.choice .t{font-family:'Black Han Sans',sans-serif;font-size:1.25rem;line-height:1.2}
.choice .d{font-size:.83rem;color:var(--ink-2);margin-top:1px}
.choice.pe{border-left-color:var(--peace)} .choice.ne{border-left-color:var(--neu)}
.choice.nu{border-left-color:var(--nuke)}
.choice:disabled{opacity:.4}
.state{text-align:center;padding:34px 14px}
.state .k{font-family:'Black Han Sans',sans-serif;font-size:1.9rem;line-height:1.2}
.log{border-left:3px solid var(--rule);padding-left:11px;margin:10px 0}
.log div{font-size:.83rem;padding:2px 0}
.hit{color:var(--peace);font-weight:600} .miss{color:var(--nuke);font-weight:600}

table.t{width:100%;border-collapse:collapse;font-size:.85rem;background:#fff}
table.t th,table.t td{border:1px solid var(--rule);padding:.42rem .5rem;text-align:center}
table.t th{background:var(--card);font-weight:600}

/* ── 룰렛 ── */
.setup{display:grid;grid-template-columns:296px 1fr;gap:26px;align-items:start}
@media(max-width:760px){.setup{grid-template-columns:1fr}}
.wheelbox{position:relative;width:296px;height:296px;margin:0 auto}
.wheelbox svg{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.13,.72,.16,1)}
.needle{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:10px solid transparent;border-right:10px solid transparent;border-top:19px solid var(--ink);z-index:2}
.slot{display:grid;grid-template-columns:62px 1fr 74px 44px;gap:9px;align-items:center;
  padding:7px 9px;border:1px solid var(--rule);background:#fff;margin-bottom:5px;border-radius:var(--r)}
.slot.done{background:var(--card)}
.sw{width:12px;height:12px;border-radius:1px;display:inline-block;vertical-align:-1px;margin-right:5px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:1.02rem;letter-spacing:.12em;font-weight:600}
.qr svg{width:42px;height:42px;display:block}.qrbig svg{width:124px;height:124px;display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:640px){
  .lane{grid-template-columns:82px 1fr 58px;gap:9px}
  .lane .who .cty{font-size:.92rem}.lane .val{font-size:1.1rem}
  .hdr .turn{font-size:1.5rem}.kcount b{font-size:2.2rem}
  .mine{grid-template-columns:1fr}
}
</style>

let createClient=null,backendLoad=null,qrlib=null;

 if(sb)return;

 await backendLoad;
}
import('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/+esm').then(m=>{qrlib=m.default;}).catch(()=>{});
const qrSVG=(t,c=3)=>{ if(!qrlib)return''; try{const q=qrlib(0,'M');q.addData(t);q.make();return q.createSvgTag(c,0);}catch(e){return'';} };

/* ===== Supabase Publishable key ===== */
const KEY_BAKED='sb_publishable_erhF21wt3qmOagP38OBaXQ_g_YQTPPO';
const URL_='https://wsmwfhoeoravcmmvreqq.supabase.co';

const NUKE_WIN=60, PEACE_WIN=80, EXPOSE_AT=40;

 {n:'사파이어국',t:'중견국',c:'#3E8175'},{n:'앰버국',t:'중견국',c:'#B5872C'},
 {n:'미스트국',t:'약소국',c:'#7C6E9B'},{n:'테라국',t:'약소국',c:'#6E7F46'}];

 {k:'핵개발',cls:'nu',d:'몰래 핵무장을 추진한다 · 핵 +6, 위장 외교로 평화도 +3'}];

 '약소국':{p:'첩보 카드 2장 (중견국과 같은 방식) · 호소 카드 1회 — 게임 중 한 번, 30초 동안 전체에게 연설할 수 있다 (다른 나라 발언 금지, 선생님께 선언).'}};

const H=()=>Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const setH=o=>{location.hash=new URLSearchParams({...H(),...o}).toString();};
let h=H(); if(!KEY&&h.k)KEY=h.k;
async function safeFetch(input,init){init=init||{};let url=input,o={...init};
  if(typeof Request!=='undefined'&&input instanceof Request){url=input.url;o={method:input.method,headers:input.headers,body:init.body,...init};}
  else if(input&&typeof input==='object'&&input.url)url=input.url;
  const hd=o.headers;
  if(hd&&typeof hd.forEach==='function'&&hd.constructor!==Object){const pl={};hd.forEach((v,k)=>{pl[k]=v;});o.headers=pl;}
  delete o.signal; return fetch(String(url),o);}
const memStore=(()=>{const m=new Map();return{getItem:k=>m.has(k)?m.get(k):null,
  setItem:(k,v)=>{m.set(k,String(v));},removeItem:k=>{m.delete(k);}};})();
const base=()=>location.origin+location.pathname;
const link=c=>{const q=new URLSearchParams({s:c});if(!KEY_BAKED&&KEY)q.set('k',KEY);return base()+'#'+q.toString();};

      x2="${21+19*Math.cos(a)}" y2="${21+19*Math.sin(a)}" stroke="#A8873C" stroke-width="1"/>`;}).join('')}
</svg>`;
const app=document.getElementById('app');

const el=x=>{
 const key=briefContext?`${H().s||H().demo||''}:${me?.country||''}:${briefContext.g.round_no}:${briefContext.g.phase}`:'';
 const selections=Object.fromEntries(['sanc','spy'].map(id=>[id,document.getElementById(id)?.value||'']));

 if(key&&key===lastRenderKey){for(const [id,value] of Object.entries(selections)){const field=document.getElementById(id);if(field)field.value=value;}if(specialOpen&&document.getElementById('special-options'))document.getElementById('special-options').open=true;}
 lastRenderKey=key;
};

let sb=null;
async function rpc(fn,args){let r;
  try{await ensureBackend();r=await sb.rpc(fn,args);}
  catch(e){const m=String(e&&e.message||e);
    if(/postMessage|cloned|Failed to fetch|NetworkError/i.test(m))
      throw new Error('서버에 연결하지 못했습니다. 미리보기 창에서는 막히니 실제 주소에 배포한 뒤 열어 주세요.');
    throw e;}
  if(r.error)throw new Error(String(r.error.message).replace(/^.*?:\s*/,''));
  return r.data;}

function keyScreen(msg){el(`<div class="narrow"><h1>선생님 1회 설정</h1>

  on('demo',()=>{setH({demo:'1',t:'',s:'',n:''});});

let tS=null,tT=null,spin=false,angle=0,sig='',lastR=null;
async function teacher(code){clearInterval(tT);sig='';
  const pull=async()=>{try{const st=await rpc('gg_admin_state',{p_code:code});
      const s2=JSON.stringify(st); if(s2===sig||spin)return; sig=s2;tS=st;drawTeacher(code);}
    catch(e){clearInterval(tT);el(eb(e.message)+`<button class="btn ghost" id="b">처음으로</button>`);
      on('b',()=>{setH({t:''});route();});}};
  await pull(); tT=setInterval(pull,1800);}
async function refresh(code){tS=await rpc('gg_admin_state',{p_code:code});sig=JSON.stringify(tS);drawTeacher(code);}

function drawTeacher(code){
  const g=tS.game,teams=tS.teams,done=new Set(tS.submitted||[]);
  if(teams.some(t=>!t.country))return drawSetup(code,teams);
  const fin=g.status!=='playing';

  const pips=Array.from({length:g.max_turns},(_,i)=>{const n=i+1;

    return `<div class="pip${un?' un':''}${n<g.round_no?' on':''}${n===g.round_no?' now':''}"

  const lanes=teams.map(t=>{

        ${portrait(leaderIndex(t.country),'mini')}<div><div class="cty">${esc(t.country)}</div>

function drawSetup(code,teams){
  const taken=new Set(teams.filter(t=>t.country).map(t=>t.country));
  const pool=(teams.length===5?COUNTRIES.filter(c=>POOL5.includes(c.n)):COUNTRIES).filter(c=>!taken.has(c.n));
  const nx=teams.find(t=>!t.country);
  const R=138,C=148,n=pool.length;
  const sec=pool.map((c,i)=>{const a0=(i/n)*2*Math.PI-Math.PI/2,a1=((i+1)/n)*2*Math.PI-Math.PI/2,m=(a0+a1)/2;
    const P=(a,r)=>[C+r*Math.cos(a),C+r*Math.sin(a)];
    const[x0,y0]=P(a0,R),[x1,y1]=P(a1,R),[tx,ty]=P(m,R*.62);
    return `<path d="M${C},${C} L${x0},${y0} A${R},${R} 0 ${(a1-a0)>Math.PI?1:0},1 ${x1},${y1} Z"
     fill="${c.c}" stroke="#E4E9EB" stroke-width="2"/><text x="${tx}" y="${ty}" fill="#fff" font-size="13"
     font-weight="600" text-anchor="middle" dominant-baseline="middle"
     transform="rotate(${m*180/Math.PI+90},${tx},${ty})">${c.n.replace('국','')}</text>`;}).join('');
  el(`<div class="banner"><div class="ttl">${SEAL}<div>
    <div class="turn">대표부 배정</div>
    <div class="sub">${teams.length}개 모둠 · 룰렛으로 뽑습니다</div></div></div></div>
  <div class="setup"><div>
    <div class="wheelbox"><div class="needle"></div>
      <svg id="wh" viewBox="0 0 296 296" style="transform:rotate(${angle}deg)">${sec}
      <circle cx="148" cy="148" r="16" fill="#E4E9EB" stroke="#0F2027" stroke-width="2"/></svg></div>
    <button class="btn wide" id="spin" style="margin-top:13px"${spin?' disabled':''}>${esc(nx.group_label)} 뽑기</button>
    <p class="small muted" style="text-align:center;margin-top:8px">국력은 뽑기로 정해집니다.
      아무도 자기 국력을 고르지 않았다는 사실이 성찰의 재료가 됩니다.</p></div>
  <div>${teams.map(t=>`<div class="slot ${t.country?'done':''}"><b>${esc(t.group_label)}</b>
    <span>${t.country?`<span class="sw" style="background:${COLOR[t.country]}"></span><b>${esc(t.country)}</b>
      <span class="small muted">${esc(t.tier)}</span>`:'<span class="muted small">대기</span>'}</span>
    <span class="code">${esc(t.join_code)}</span><span class="qr">${qrSVG(link(t.join_code),2)}</span></div>`).join('')}
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="bPrint">신임장 인쇄</button></div>
    <div class="panel" style="margin-top:14px"><h2>등급별 특권</h2>
      <table class="t"><tr><th>등급</th><th>특권</th></tr>
      <tr><td>강대국</td><td>지목 카드 2장 (상대 선택에 따라 우리 평화 +10 / −4 / −10)</td></tr>
      <tr><td>중견국</td><td>첩보 카드 2장</td></tr>
      <tr><td>약소국</td><td>첩보 카드 2장 · 호소 카드 1회</td></tr></table></div>
      <p class="small muted" style="margin:.5rem 0 0">모든 나라는 평화 5점을 갖고 시작합니다.</p>
  </div></div>`);
  on('bPrint',()=>printCards(teams));
  on('spin',()=>{if(spin)return;spin=true;document.getElementById('spin').disabled=true;
    const i=Math.floor(Math.random()*pool.length),seg=360/pool.length;
    const tgt=360*6+(360-(i*seg+seg/2)); angle=tgt;
    document.getElementById('wh').style.transform=`rotate(${tgt}deg)`;
    setTimeout(async()=>{const c=pool[i];
      try{await rpc('gg_assign_country',{p_code:code,p_slot:nx.slot,p_country:c.n,p_tier:c.t});}
      catch(e){alert(e.message);}
      angle=tgt%360;spin=false;await refresh(code);},4400);});}

let sT=null,me=null,sSig='';
async function student(join){clearInterval(sT);sSig='';
  try{me=await rpc('gg_join',{p_join_code:join});}catch(e){setH({s:''});return home(e.message);}
  const pull=async()=>{try{
    const[{data:g},st]=await Promise.all([
      sb.from('gg_games').select('round_no,max_turns,phase,status,outcome,last_k,last_p').eq('id',me.game_id).single().then(r=>{if(r.error)throw r.error;if(!r.data)throw new Error('회의 정보를 찾을 수 없습니다.');return r;}),
      rpc('gg_status',{p_join_code:join})]);
    document.getElementById('connection-warning')?.remove();const s2=JSON.stringify([g,st]); if(s2===sSig)return; sSig=s2; drawStudent(join,g,st);document.getElementById('connection-warning')?.remove();}catch(e){if(!document.getElementById('connection-warning')){const notice=document.createElement('div');notice.id='connection-warning';notice.className='err';notice.setAttribute('role','status');notice.textContent='회의 정보를 갱신하지 못했습니다. 연결을 다시 확인하는 중입니다.';app.prepend(notice);}}};
  await pull(); sT=setInterval(pull,2000);}

 if(g.status!=='playing')return '우리의 선택이 다른 나라에 어떤 영향을 주었는지 되짚어 봅시다. 안전을 위한 선택이 모두의 불안으로 이어지지는 않았나요?';
 if(role==='foreign')return g.phase==='negotiation'?'다른 나라에 평화 선택을 제안해 보세요. 약속을 지키도록 설득할 근거와, 약속을 어겼을 때의 대응을 함께 생각하세요.':'평화의 기본 이득은 6에서 이번 핵개발국 수를 뺀 값입니다. 협력하는 나라가 많을수록 평화 노선의 이득이 커집니다.';
 if(role==='defense')return st.nuke_pts>=35?'핵 포인트가 40을 넘으면 핵실험이 탐지됩니다. 다른 나라의 평화가 8씩 줄어드는 파장까지 검토하세요.':'핵개발은 핵 +6, 평화 +3입니다. 그러나 두 나라가 같은 회의에서 핵 60에 도달하면 모두 패배합니다. 상대의 진행 상황은 확실하지 않습니다.';
 if(role==='intel')return me?.tier==='강대국'?'지목은 상대의 이번 선택에 달려 있습니다. 핵개발이면 적중하지만, 평화면 우리 −4, 중립이면 우리 −10입니다. 추측과 확인된 정보를 구분하세요.':'첩보는 상대의 이번 선택과 핵 포인트를 알려 줍니다. 핵개발이면 우리 평화 +5, 아니면 −5입니다. 알아낸 정보를 누구와 공유할지도 전략입니다.';
 if(g.phase==='negotiation')return '외교장관은 협상안을, 국방장관은 안보 위험을, 정보장관은 근거를 제시해 주세요. 최종 선택은 모둠 전체가 합의합니다.';
 if(st.my_card)return '우리의 결정은 전달되었습니다. 다른 대표부의 선택을 기다리며, 약속과 실제 결과가 일치하는지 확인합시다.';
 return '우리의 안전과 모두의 평화가 같은 방향인지 생각해 봅시다. 장관들의 관점을 검토하고, 이번 회의의 카드를 함께 결정하세요.';
}
function commandBrief(g,st){briefContext={g,st};const i=leaderIndex(me.country),l=LEADERS[i];return `<section class="command-brief">${portrait(i)}<div class="command-copy"><div class="eyebrow">${esc(me.country||'국가 배정 대기')} / 대표부 전략회의</div><h2>${l.name}<span>${l.title}</span></h2><p id="advisor-quote" class="quotation" aria-live="polite">${advice(currentRole,g,st)}</p><div class="role-tabs" aria-label="역할별 관점">${Object.entries(ROLES).map(([k,v])=>`<button type="button" class="role-tab" data-role="${k}" aria-pressed="${currentRole===k}">${v}</button>`).join('')}</div><div class="brief-note">역할을 눌러 관점을 확인하세요 · 공통 규칙에 따른 조언</div></div></section>`;}
function policyDecoration(c){const index=CARDS.indexOf(c),effects=['평화 +6 − 핵개발국 수','평화 +4 / 핵 +2','평화 +3 / 핵 +6'];return `<span class="policy-icon" aria-hidden="true">${['◇','⚖','⚛'][index]}</span><div class="policy-code">POLICY / 0${index+1}</div><div class="t">${c.k}</div><div class="d">${c.d}</div><div class="policy-effect">${effects[index]}</div>`;}
function showDemo(){
 const c=COUNTRIES[demoNation];me={country:c.n,tier:c.t,group_label:'체험 대표부'};
 const g={round_no:4,max_turns:15,phase:'submit',status:'playing',last_k:1};
 const st={peace_pts:20,nuke_pts:12,my_card:null,exposed:[],spy_results:[],sanction_results:[],sanctions_left:2,spy_left:2,roster:COUNTRIES.filter(x=>x.n!==c.n).map((x,i)=>({id:String(i),country:x.n})),submitted:3,total:6};
 drawStudent('DEMO',g,st);
 const marker=document.createElement('div');marker.className='demo-banner';marker.innerHTML=`<span><b>전략실 체험</b> · 예시 점수이며 실제 게임에 제출되지 않습니다.</span><label style="margin:0">체험 국가 <select id="demo-country">${COUNTRIES.map((x,i)=>`<option value="${i}"${i===demoNation?' selected':''}>${x.n}</option>`).join('')}</select></label><button class="btn ghost" id="demo-teacher">의장석 보기</button>`;
 app.querySelector('.topbar').after(marker);
 document.getElementById('demo-country').onchange=e=>{demoNation=+e.target.value;showDemo();};
 on('demo-teacher',showTeacherDemo);
}
function showPolicyDemo(k){const c=CARDS.find(x=>x.k===k);openGameDialog(`${k} 카드 · 체험`,`${policyDecoration(c)}<p class="note">실제 게임에서는 모둠이 합의한 뒤 카드를 한 번 제출합니다. 체험에서는 서버로 제출하거나 점수를 변경하지 않습니다.</p><p>지목·첩보와 상대 국가의 선택에 따라 최종 결과가 달라집니다. 실제 수업은 처음 화면에서 모둠 코드로 입장하세요.</p>`);}
function showTeacherDemo(){
 tS={game:{round_no:4,max_turns:15,phase:'submit',status:'playing',title:'국제사회 모의회의 · 체험',last_k:1},teams:COUNTRIES.map((c,i)=>({id:i,country:c.n,tier:c.t,group_label:`${i+1}모둠`,peace_pts:[20,17,23,21,19,18][i],exposed:false,sanctions_left:2,spy_left:2,join_code:'체험'})),submitted:[0,2,4]};
 drawTeacher('DEMO');
 const marker=document.createElement('div');marker.className='demo-banner';marker.innerHTML='<span><b>의장석 체험</b> · 가상 데이터입니다. 진행·공개·인쇄 기능은 실제 수업에서 사용하세요.</span><button class="btn ghost" id="demo-back">대표부로 돌아가기</button>';
 app.querySelector('.topbar').after(marker);on('demo-back',showDemo);
 ['bNeg','bSub','bEnd','bNext','bPrint','bRev','unN','unP'].forEach(id=>{const b=document.getElementById(id);if(b){b.disabled=true;b.onclick=null;}});
}

/* ══════════ 라우팅 ══════════ */
function route(){h=H();clearInterval(tT);clearInterval(sT);
  if(h.demo)return showDemo();
  if(!KEY)return keyScreen();
  if(h.n)return newGame();
  if(h.t)return teacher(h.t);
  if(h.s)return student(h.s);
  home();}
window.addEventListener('hashchange',route);
route();
</script>
